<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>frontend-less-ai-tone 对照</title>
  <style>
    :root { --paper: #e7e1d4; --ink: #1f1a14; --muted: #5c5346; --line: #c9c0b0; --oxide: #9a3412; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", sans-serif;
      background: var(--paper); color: var(--ink); line-height: 1.55;
      padding: 32px 8% 64px;
    }
    h1 { font-size: clamp(22px, 3vw, 32px); font-weight: 600; margin: 12px 0 10px; }
    p { color: var(--muted); max-width: 40em; margin-bottom: 16px; }
    a { color: var(--oxide); }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 28px; }
    figure { margin: 0; }
    img { width: 100%; height: auto; border: 1px solid var(--line); display: block; }
    figcaption { margin-top: 10px; font-weight: 600; color: var(--ink); }
    figcaption span { display: block; font-weight: 400; color: var(--muted); font-size: 14px; margin-top: 4px; }
    @media (max-width: 800px) { .pair { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <p>frontend-less-ai-tone · 同一份 brief</p>
  <h1>忻州精工减速机，两页对照</h1>
  <p>读者是采购和工程师。主行动是索取规格表。已知硬齿面斜齿轮、速比 5–100、扭矩至 18 kN·m、安装面 B3/B5。认证、客户、产能没有资料，后一页写成缺口，没有编。</p>
  <p>这是 Skill 被执行时的输出对照，不是审美通过证明。</p>
  <div class="pair">
    <figure>
      <a href="before.html"><img src="before.png" alt="未用 Skill：紫黑渐变、Get Started、假客户墙" /></a>
      <figcaption>未用 Skill <span><a href="before.html">打开整页</a> · Inter / 紫黑光斑 / 立即体验</span></figcaption>
    </figure>
    <figure>
      <a href="after.html"><img src="after.png" alt="用了 Skill：新闻纸底、超大速比、获取规格表" /></a>
      <figcaption>用了 Skill <span><a href="after.html">打开整页</a> · 记忆点是 5–100，按钮写接下来会发生什么</span></figcaption>
    </figure>
  </div>
</body>
</html>
